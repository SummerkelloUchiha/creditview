<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreditView</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<h1>CreditView</h1>
<p>How online retailers could showcase monthly repayments directly in product listings.</p>

<div class="controls">
<select id="retailer">
<option value="amazon">Amazon Inspired</option>
<option value="takealot">Takealot Inspired</option>
<option value="mrprice">Mr Price Inspired</option>
<option value="sportscene">Sportscene Inspired</option>
<option value="makro">Makro Inspired</option>
<option value="woolworths">Woolworths Inspired</option>
</select>

<select id="mode">
<option value="credit">Credit First</option>
<option value="cash">Traditional Retail</option>
</select>
</div>
</header>

<section>
<h2 id="title"></h2>
<div id="products" class="grid"></div>
</section>

<footer>
<p>Concept demo by Samkelo Maphumulo</p>
</footer>

<script src="app.js"></script>
</body>
</html>
